name: Mirror registry to Supabase

on:
  push:
    branches: [main]
    paths:
      - registry.json
      - blocklist.json
      - .github/workflows/mirror-supabase.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror validated indexes
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PROJECT_URL: https://epwpiygffxmtenagtvur.supabase.co
        run: |
          set -euo pipefail
          for file in registry.json blocklist.json; do
            node -e "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))" "$file"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "apikey: $SUPABASE_SERVICE_KEY" \
              --header "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              --header "Content-Type: application/json" \
              --header "x-upsert: true" \
              --data-binary "@$file" \
              "$SUPABASE_PROJECT_URL/storage/v1/object/extension-registry/$file"
          done
