name: Registry integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-integrity:
    name: Registry integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Registry laden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js laden
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Katalog und Blockliste prüfen
        run: npm run check

      - name: Alle gelisteten Pakete erneut prüfen
        run: npm run audit:packages

      - name: ClamAV mit frischen Signaturen installieren
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam --stdout

      - name: Pakete auf bekannte Schadsoftware prüfen
        run: clamscan --recursive --infected --no-summary .registry-audit/unpacked
